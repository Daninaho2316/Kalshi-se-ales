name: Kalshi Signal Bot

on:
  schedule:
    - cron: "0 * * * *"    # red de seguridad cada hora, por si la cadena se corta
  workflow_dispatch: {}     # permite correrlo manualmente desde la pestaña Actions

permissions:
  contents: write
  actions: write           # necesario para que el propio workflow dispare la siguiente corrida

jobs:
  check-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: kalshi-signals
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Escribir clave privada desde secret (base64)
        run: |
          echo "${{ secrets.KALSHI_PRIVATE_KEY }}" | base64 -d > kalshi_private_key.pem
          python3 -c "
          from cryptography.hazmat.primitives import serialization
          with open('kalshi_private_key.pem', 'rb') as f:
              data = f.read()
          print('bytes reconstruidos:', len(data))
          key = serialization.load_pem_private_key(data, password=None)
          print('Clave privada valida y cargada correctamente.')
          "

      - name: Correr motor de señales (vigilancia casi continua, ~5h45min)
        env:
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_PRIVATE_KEY_PATH: kalshi_private_key.pem
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 signal_engine.py

      - name: Borrar clave privada temporal
        if: always()
        run: rm -f kalshi_private_key.pem

      - name: Guardar estado y logs
        if: always()
        run: |
          git config user.name "kalshi-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json logs/signals.csv || true
          git diff --cached --quiet || git commit -m "actualiza estado y señales [skip ci]"
          git push || true

      - name: Encadenar la siguiente corrida (no esperar al cron de GitHub)
        if: always()
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/signals.yml/dispatches" \
            -d '{"ref":"main"}' \
            -w "encadenado: HTTP %{http_code}\n"
